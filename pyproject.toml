[project]
name = "raqindex"
license = "MIT"
version = "0.1.0"
description = "Unofficial async OpenAlex client with schema-generated models, OQO queries, and persistent caching"
readme = "README.md"
authors = [
    { name = "raqkaaq", email = "eryan97@raqkaaq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.3",
    "hishel[async]>=1.4.0",
    "httpx2>=2.13.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pytimeparse2>=1.7.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
